[project]
name = "gpt-newspaper"
version = "2.0.0"
description = "A personalized AI newspaper, researched with Tavily and written by a team of LangGraph agents."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-tavily>=0.2",
    "langchain-openai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "certifi",
]

[project.optional-dependencies]
# Install the integration for whichever provider you point LLM_MODEL at.
anthropic = ["langchain-anthropic>=1.0"]
google = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=1.0"]
groq = ["langchain-groq>=1.0"]
mistral = ["langchain-mistralai>=1.0"]
all = [
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=1.0",
    "langchain-groq>=1.0",
    "langchain-mistralai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, bandit (security), ruff-specific
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic quotes in user-facing copy are intentional
    "S104",  # binding to 0.0.0.0 is deliberate for Docker
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
